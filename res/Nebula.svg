  <text x="22" y="111" font-size="1.4" fill="#666" text-anchor="middle">MODE</text>
  <circle cx="15" cy="114" r="0.9" fill="none" stroke="#4ade80" stroke-width="0.3"/>
  <text x="11.5" y="115" font-size="1.2" fill="#4ade80">G</text>
  <rect x="20.4" y="112.5" width="3.2" height="4" fill="none" stroke="#ff6b6b" stroke-width="0.3" stroke-dasharray="0.6,0.6" rx="0.3"/>
  <circle cx="29" cy="114" r="0.9" fill="none" stroke="#f87171" stroke-width="0.3"/>
  <text x="32.5" y="115" font-size="1.2" fill="#f87171">W</text>

