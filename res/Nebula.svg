  <text x="63.5" y="63.5" font-size="1.6" fill="#666" text-anchor="middle" letter-spacing="2">PHASE MOD</text>
  <text x="55" y="69" font-size="1.4" fill="#aaa" text-anchor="middle">AMT</text>
  <circle cx="55" cy="72.5" r="2.2" fill="none" stroke="#ccc" stroke-width="0.3" stroke-dasharray="0.6,0.6"/>
  <text x="72" y="69" font-size="1.4" fill="#aaa" text-anchor="middle">DIR</text>
  <rect x="70.4" y="70.5" width="3.2" height="4" fill="none" stroke="#ccc" stroke-width="0.3" stroke-dasharray="0.6,0.6" rx="0.3"/>

  <line x1="48" y1="78" x2="79" y2="78" stroke="#cfc7b2" stroke-width="0.2"/>

  <!-- DRIFT (Future) -->
  <text x="63.5" y="82" font-size="1.6" fill="#666" text-anchor="middle" letter-spacing="2">DRIFT</text>
  <circle cx="63.5" cy="88" r="2.2" fill="none" stroke="#ccc" stroke-width="0.3" stroke-dasharray="0.6,0.6"/>

  <line x1="48" y1="93" x2="79" y2="93" stroke="#cfc7b2" stroke-width="0.2"/>


  <line x1="48" y1="111" x2="79" y2="111" stroke="#cfc7b2" stroke-width="0.2"/>

  <!-- MASTER -->
  <text x="63.5" y="115" font-size="1.6" fill="#666" text-anchor="middle" letter-spacing="2">MASTER</text>
  <circle cx="63.5" cy="120" r="2.5" fill="none" stroke="#888" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>


