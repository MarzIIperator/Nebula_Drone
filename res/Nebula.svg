  <line x1="6" y1="14" x2="121" y2="14" stroke="#888" stroke-width="0.25"/>

  <!-- ========== BANK A LABEL ========== -->
  <rect x="14" y="17.5" width="16" height="3.5" fill="#ff6b6b" opacity="0.85" rx="0.8"/>
  <text x="22" y="20" font-size="2.4" font-weight="bold" fill="#fff"
        text-anchor="middle" letter-spacing="1.5">BANK A</text>

  <!-- ===== BANK A: PITCH SECTION ===== -->
  <text x="22" y="25.5" font-size="2" fill="#666" text-anchor="middle" letter-spacing="0.5">PITCH</text>
  <circle cx="22" cy="34" r="7" fill="none" stroke="#ff6b6b" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>
  <!-- Fine -->
  <text x="35" y="32" font-size="1.6" fill="#666" text-anchor="middle">FINE</text>
  <circle cx="35" cy="36" r="2.5" fill="none" stroke="#ff6b6b" stroke-width="0.3" stroke-dasharray="0.6,0.6"/>

  <line x1="8" y1="44" x2="36" y2="44" stroke="#cfc7b2" stroke-width="0.2"/>

  <!-- ===== BANK A: WAVETABLE ===== -->
  <text x="22" y="48.5" font-size="2" fill="#666" text-anchor="middle" letter-spacing="0.5">MORPH</text>
  <circle cx="22" cy="55" r="4" fill="none" stroke="#ff6b6b" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>

  <text x="22" y="65" font-size="2" fill="#666" text-anchor="middle" letter-spacing="0.5">VOLUME</text>
  <circle cx="22" cy="71" r="4" fill="none" stroke="#ff6b6b" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>

  <!-- Sub row -->
  <text x="14" y="80.5" font-size="1.5" fill="#666" text-anchor="middle">SUB</text>
  <circle cx="14" cy="84.5" r="2.4" fill="none" stroke="#ff6b6b" stroke-width="0.3" stroke-dasharray="0.6,0.6"/>

  <text x="22" y="80.5" font-size="1.5" fill="#666" text-anchor="middle">OCT</text>
  <rect x="20.2" y="82.5" width="3.6" height="4" fill="none" stroke="#ff6b6b" stroke-width="0.3" stroke-dasharray="0.6,0.6" rx="0.3"/>

  <text x="30" y="80.5" font-size="1.5" fill="#666" text-anchor="middle">PAN</text>
  <circle cx="30" cy="84.5" r="2.4" fill="none" stroke="#ff6b6b" stroke-width="0.3" stroke-dasharray="0.6,0.6"/>

  <line x1="8" y1="91" x2="36" y2="91" stroke="#cfc7b2" stroke-width="0.2"/>


