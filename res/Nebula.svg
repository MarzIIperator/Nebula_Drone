  <text x="22" y="120" font-size="1.6" fill="#666" text-anchor="middle">OUT L</text>
  <circle cx="22" cy="120.5" r="3" fill="none" stroke="#ff6b6b" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>


