  <text x="63.5" y="25.5" font-size="1.6" fill="#666" text-anchor="middle" letter-spacing="2">FILTER</text>
  <text x="63.5" y="30" font-size="2" fill="#666" text-anchor="middle">CUTOFF</text>
  <circle cx="63.5" cy="38" r="6" fill="none" stroke="#888" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>

  <text x="55" y="50" font-size="1.5" fill="#666" text-anchor="middle">RES</text>
  <circle cx="55" cy="54" r="2.4" fill="none" stroke="#888" stroke-width="0.3" stroke-dasharray="0.6,0.6"/>
  <text x="72" y="50" font-size="1.5" fill="#666" text-anchor="middle">LP·HP</text>
  <rect x="70.4" y="52" width="3.2" height="4" fill="none" stroke="#888" stroke-width="0.3" stroke-dasharray="0.6,0.6" rx="0.3"/>

