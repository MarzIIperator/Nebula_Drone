  <text x="105" y="25.5" font-size="2" fill="#666" text-anchor="middle" letter-spacing="0.5">PITCH</text>
  <circle cx="105" cy="34" r="7" fill="none" stroke="#4ecdc4" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>
  <!-- Fine (left side, mirrored) -->
  <text x="92" y="32" font-size="1.6" fill="#666" text-anchor="middle">FINE</text>
  <circle cx="92" cy="36" r="2.5" fill="none" stroke="#4ecdc4" stroke-width="0.3" stroke-dasharray="0.6,0.6"/>

  <line x1="91" y1="44" x2="119" y2="44" stroke="#cfc7b2" stroke-width="0.2"/>

  <!-- ===== BANK B: WAVETABLE ===== -->
  <text x="105" y="48.5" font-size="2" fill="#666" text-anchor="middle" letter-spacing="0.5">MORPH</text>
  <circle cx="105" cy="55" r="4" fill="none" stroke="#4ecdc4" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>

  <text x="105" y="65" font-size="2" fill="#666" text-anchor="middle" letter-spacing="0.5">VOLUME</text>
  <circle cx="105" cy="71" r="4" fill="none" stroke="#4ecdc4" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>

  <!-- Sub row (mirrored) -->
  <text x="97" y="80.5" font-size="1.5" fill="#666" text-anchor="middle">PAN</text>
  <circle cx="97" cy="84.5" r="2.4" fill="none" stroke="#4ecdc4" stroke-width="0.3" stroke-dasharray="0.6,0.6"/>

  <text x="105" y="80.5" font-size="1.5" fill="#666" text-anchor="middle">OCT</text>
  <rect x="103.2" y="82.5" width="3.6" height="4" fill="none" stroke="#4ecdc4" stroke-width="0.3" stroke-dasharray="0.6,0.6" rx="0.3"/>

  <text x="113" y="80.5" font-size="1.5" fill="#666" text-anchor="middle">SUB</text>
  <circle cx="113" cy="84.5" r="2.4" fill="none" stroke="#4ecdc4" stroke-width="0.3" stroke-dasharray="0.6,0.6"/>

  <line x1="91" y1="91" x2="119" y2="91" stroke="#cfc7b2" stroke-width="0.2"/>


  <!-- Mode switch + LEDs -->
  <text x="105" y="111" font-size="1.4" fill="#666" text-anchor="middle">MODE</text>
  <circle cx="98" cy="114" r="0.9" fill="none" stroke="#4ade80" stroke-width="0.3"/>
  <text x="94.5" y="115" font-size="1.2" fill="#4ade80">G</text>
  <rect x="103.4" y="112.5" width="3.2" height="4" fill="none" stroke="#4ecdc4" stroke-width="0.3" stroke-dasharray="0.6,0.6" rx="0.3"/>
  <circle cx="112" cy="114" r="0.9" fill="none" stroke="#f87171" stroke-width="0.3"/>
  <text x="115.5" y="115" font-size="1.2" fill="#f87171">W</text>

  <!-- Output R -->
  <text x="105" y="120" font-size="1.6" fill="#666" text-anchor="middle">OUT R</text>
  <circle cx="105" cy="120.5" r="3" fill="none" stroke="#4ecdc4" stroke-width="0.4" stroke-dasharray="0.6,0.6"/>

</svg>