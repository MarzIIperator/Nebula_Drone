<?xml version="1.0" encoding="UTF-8"?>
<svg width="127mm" height="128.5mm" viewBox="0 0 127 128.5"
     xmlns="http://www.w3.org/2000/svg"
     font-family="Helvetica, Arial, sans-serif">

  <!-- ========== BACKGROUND ========== -->
  <rect width="127" height="128.5" fill="#e8e6dd"/>

  <!-- Subtle bank tints -->
  <rect x="3"   y="16" width="38" height="106" fill="#ff6b6b" opacity="0.06" rx="1.5"/>
  <rect x="86"  y="16" width="38" height="106" fill="#4ecdc4" opacity="0.06" rx="1.5"/>
  <rect x="44"  y="16" width="39" height="106" fill="#9b8f7a" opacity="0.04" rx="1.5"/>

  <!-- Frame -->
  <rect x="3" y="16" width="38"  height="106" fill="none" stroke="#cfc7b2" stroke-width="0.2" rx="1.5"/>
  <rect x="44" y="16" width="39" height="106" fill="none" stroke="#cfc7b2" stroke-width="0.2" rx="1.5"/>
  <rect x="86" y="16" width="38" height="106" fill="none" stroke="#cfc7b2" stroke-width="0.2" rx="1.5"/>

  <!-- ========== MOUNTING HOLES ========== -->
  <circle cx="7.62"   cy="3"     r="1.5" fill="#2a2a3e"/>
  <circle cx="119.38" cy="3"     r="1.5" fill="#2a2a3e"/>
  <circle cx="7.62"   cy="125.5" r="1.5" fill="#2a2a3e"/>
  <circle cx="119.38" cy="125.5" r="1.5" fill="#2a2a3e"/>

